apiVersion: apps/v1
kind: Deployment
metadata:
  name: condo-frontend
  labels:
    app: condo-frontend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: condo-frontend
  template:
    metadata:
      labels:
        app: condo-frontend
    spec:
      containers:
      - name: frontend
        image: condo-frontend:latest # Replace with ECR URI
        ports:
        - containerPort: 80
        readinessProbe:
          httpGet:
            path: /
            port: 80
          initialDelaySeconds: 5
          periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: condo-frontend
spec:
  selector:
    app: condo-frontend
  ports:
    - protocol: TCP
      port: 80
      targetPort: 80
  type: ClusterIP
